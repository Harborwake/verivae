<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Verivae helps people pause, assess scam risk, save evidence, and choose safer next steps."
    >
    <title>Verivae | Scam Protection MVP</title>
    <meta name="theme-color" content="#17283f">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/verivae-icon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/verivae-icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/verivae-icon-180.png">
    <link rel="manifest" href="site.webmanifest">
    <script>
      (() => {
        const defaultMode = "light";
        const allowedModes = new Set(["light", "dark", "system"]);

        try {
          const saved = JSON.parse(localStorage.getItem("verivae:settings:v1") || "{}");
          const mode = allowedModes.has(saved.themeMode) ? saved.themeMode : defaultMode;
          const prefersDark =
            mode === "system" &&
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          const resolved = mode === "dark" || prefersDark ? "dark" : "light";

          document.documentElement.dataset.theme = resolved;
          document.documentElement.dataset.themePreference = mode;
          document.documentElement.style.colorScheme = resolved;
        } catch (error) {
          document.documentElement.dataset.theme = defaultMode;
          document.documentElement.dataset.themePreference = defaultMode;
        }
      })();
    </script>
    <link rel="stylesheet" href="src/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#home" aria-label="Verivae home">
          <span class="brand-mark" aria-hidden="true">
            <img src="assets/verivae-icon-192.png" alt="">
          </span>
          <span>
            <strong>Verivae</strong>
            <small>by Harborwake</small>
          </span>
        </a>
        <span class="privacy-chip">Prototype only</span>
      </header>

      <main id="app" tabindex="-1"></main>

      <nav class="bottom-nav" aria-label="Primary navigation">
        <a href="#home" data-nav="home">Home</a>
        <a href="#check" data-nav="check">Check</a>
        <a href="#vault" data-nav="vault">Vault</a>
        <a href="#recovery" data-nav="recovery">Recovery</a>
        <a href="#settings" data-nav="settings">Settings</a>
      </nav>
    </div>

    <script src="src/scamDetection.js"></script>
    <script src="src/storage.js"></script>
    <script src="src/app.js"></script>
  </body>
</html>
